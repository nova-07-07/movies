.loader{

    top:50%;
    left:50%;

    display:none;
}

];

var video = document.getElementById("video");
var sidebar = document.getElementById("sidebar");
var loader = document.getElementById("loader");

var hls = null;
var selected = 0;
var start = 0;
var hideTimer = null;

function getVisibleCount(){

    var sidebarHeight = window.innerHeight;

    var itemHeight = 58;

    return Math.floor(sidebarHeight / itemHeight);
}

function render(){

    sidebar.innerHTML = "";

    var VISIBLE = getVisibleCount();

    for(var i=0;i<VISIBLE;i++){

        var index = start + i;

        if(index >= CHANNELS.length){
            break;
        }

        var ch = CHANNELS[index];

        var div = document.createElement("div");

        div.className = "channel";

        if(index == selected){
            div.className += " selected";
        }

        div.innerHTML = ch.name;

        div.setAttribute("data-index",index);

        div.onclick = function(){

            selected = parseInt(this.getAttribute("data-index"));

            play(selected);

            render();
        };

        sidebar.appendChild(div);
    }
}

function play(index){

    loader.style.display = "block";

    if(hls){
        hls.destroy();
        hls = null;
    }

    var url = CHANNELS[index].url;

    video.pause();

    video.removeAttribute("src");

    video.load();

    video.muted = true;

    if(video.canPlayType('application/vnd.apple.mpegurl')){

        video.src = url;

    }else if(window.Hls && Hls.isSupported()){

        hls = new Hls({
            enableWorker:false
        });

        hls.loadSource(url);

        hls.attachMedia(video);

    }else{

        video.src = url;
    }

    video.onplaying = function(){

        loader.style.display = "none";

        setTimeout(function(){

            video.muted = false;

        },1000);
    };

    video.onerror = function(){

        loader.style.display = "none";

        alert("Stream not supported");
    };

    setTimeout(function(){

        video.play();

    },500);
}

function showSidebar(){

    sidebar.style.opacity = "1";

    clearTimeout(hideTimer);

    hideTimer = setTimeout(function(){

        sidebar.style.opacity = "0";

    },5000);
}

document.body.onclick = showSidebar;

document.addEventListener("keydown",function(e){

    showSidebar();

    if(e.keyCode == 40){

        var VISIBLE = getVisibleCount();

        if(selected < CHANNELS.length - 1){

            selected++;

            if(selected >= start + VISIBLE){
                start++;
            }

            render();
        }
    }

    if(e.keyCode == 38){

        if(selected > 0){

            selected--;

            if(selected < start){
                start--;
            }

            render();
        }
    }

    if(e.keyCode == 13){

        play(selected);
    }
});

render();

play(0);

showSidebar();

</script>
